<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LabMed — Gestão Clínica</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              50: '#F0FDF4', 100: '#DCFCE7', 200: '#BBF7D0',
              300: '#86EFAC', 400: '#4ADE80', 500: '#22C55E',
              600: '#16A34A', 700: '#15803D', 800: '#166534',
              900: '#14532D',
            },
            destaque: '#F59E0B',
          },
          fontFamily: {
            display: ['"Playfair Display"', 'Georgia', 'serif'],
            body: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'marca': '0 2px 16px rgba(20,83,29,0.12)',
            'marca-lg': '0 8px 32px rgba(20,83,29,0.18)',
            'interno': 'inset 0 2px 6px rgba(0,0,0,0.06)',
            'nav': '0 -4px 20px rgba(20,83,29,0.10)',
          },
          borderRadius: {
            'app': '28px',
            'card': '18px',
            'btn': '14px',
            'input': '12px',
          },
        },
      },
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: #020617;
      display: flex; align-items: center; justify-content: center;
    }

    .app-frame {
      width: 390px; height: 100dvh; max-height: 844px;
      background: #F0FDF4; position: relative; overflow: hidden;
      display: flex; flex-direction: column;
      border-radius: 0;
      box-shadow: 0 0 0 1px #1e293b, 0 25px 60px rgba(0,0,0,0.5);
    }
    @media (min-width: 430px) {
      .app-frame { height: 844px; border-radius: 28px; }
    }

    [data-tela]:not(.hidden) {
      animation: fadeSlideUp 0.28s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .ativo { color: #14532D !important; }
    .ativo svg { stroke: #14532D; }
    .ativo::after {
      content: ''; position: absolute; top: 6px; left: 50%;
      transform: translateX(-50%); width: 20px; height: 3px;
      background: #22C55E; border-radius: 3px;
    }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #BBF7D0; border-radius: 4px; }

    :focus-visible {
      outline: 2px solid #22C55E; outline-offset: 2px; border-radius: 8px;
    }

    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 999px; font-size: 11px;
      font-weight: 600; letter-spacing: 0.02em;
    }
    .card {
      background: #fff; border-radius: 18px; padding: 18px;
      box-shadow: 0 1px 4px rgba(20,83,29,0.06), 0 4px 16px rgba(20,83,29,0.04);
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .card:active { transform: scale(0.985); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 22px; border-radius: 14px; font-weight: 600; font-size: 14px;
      cursor: pointer; border: none; transition: all 0.18s;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent; user-select: none;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: #14532D; color: #fff; }
    .btn-primary:hover { background: #166534; }
    .btn-success { background: #22C55E; color: #fff; }
    .btn-success:hover { background: #16A34A; }
    .btn-outline {
      background: transparent; color: #14532D;
      border: 1.5px solid #BBF7D0;
    }
    .btn-outline:hover { background: #F0FDF4; }

    .screen { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 88px; }

    .input-field {
      width: 100%; padding: 12px 16px; border: 1.5px solid #DCFCE7;
      border-radius: 12px; font-size: 14px; font-family: inherit;
      background: #fff; transition: border-color 0.2s, box-shadow 0.2s;
      color: #14532D;
    }
    .input-field:focus {
      outline: none; border-color: #22C55E;
      box-shadow: 0 0 0 3px rgba(34,197,94,0.15);
    }
    .input-field::placeholder { color: #86EFAC; }

    .tabela-linha {
      display: flex; padding: 14px 16px; border-bottom: 1px solid #F0FDF4;
      align-items: center; gap: 12px; cursor: pointer;
      transition: background 0.15s;
    }
    .tabela-linha:active, .tabela-linha:hover { background: #F0FDF4; }
    .tabela-linha:last-child { border-bottom: none; }

    #toast-container {
      position: absolute; top: 52px; left: 12px; right: 12px;
      z-index: 9999; display: flex; flex-direction: column; gap: 8px;
      pointer-events: none;
    }
    .toast-item {
      padding: 14px 16px; border-radius: 14px; font-size: 13px;
      font-weight: 500; color: #fff; pointer-events: auto;
      animation: toastIn 0.35s cubic-bezier(0.22,0.61,0.36,1);
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    }
    .toast-item.sair { animation: toastOut 0.3s ease forwards; }
    .toast-ok    { background: #15803D; }
    .toast-erro  { background: #DC2626; }
    .toast-info  { background: #166534; }
    @keyframes toastIn  { from { opacity:0; transform:translateY(-16px) scale(0.94); } to { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes toastOut { to   { opacity:0; transform:translateY(-16px) scale(0.94); } }

    #modal-fundo {
      position: absolute; inset: 0; z-index: 8000;
      background: rgba(0,0,0,0.5); display: none;
      align-items: flex-end; justify-content: center;
      animation: modalBgIn 0.2s;
    }
    #modal-fundo.open { display: flex; }
    #modal-fundo.aberto { animation: modalBgIn 0.2s; }
    @keyframes modalBgIn { from { opacity:0; } to { opacity:1; } }
    #modal-caixa {
      background: #fff; border-radius: 24px 24px 0 0;
      width: 100%; max-height: 75%; overflow-y: auto;
      animation: modalSlideUp 0.3s cubic-bezier(0.22,0.61,0.36,1);
    }
    @keyframes modalSlideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
  </style>
</head>
<body>

  <div class="app-frame" id="app">

    <!-- ===== STATUS BAR ===== -->
    <div class="shrink-0 bg-marca-900 text-white flex items-center justify-between px-7 py-2 text-xs font-medium select-none" style="padding-top: env(safe-area-inset-top, 10px);">
      <span id="status-hora">14:30</span>
      <div class="flex items-center gap-1">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" class="opacity-90"><rect x="0" y="5" width="3" height="7" rx="0.8"/><rect x="4.5" y="3.5" width="3" height="8.5" rx="0.8"/><rect x="9" y="2" width="3" height="10" rx="0.8"/><rect x="13.5" y="0" width="3" height="12" rx="0.8" opacity="0.3"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" class="opacity-90"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-6-8l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 4.08 8.87 4.08 3 9z"/></svg>
        <svg width="24" height="12" viewBox="0 0 24 12" fill="currentColor" class="opacity-90"><rect x="0" y="1" width="20" height="10" rx="2.5" stroke="currentColor" stroke-width="1" fill="none" opacity="0.4"/><rect x="2" y="3" width="16" height="6" rx="1.2" fill="currentColor" opacity="0.7"/><rect x="21" y="4" width="2" height="4" rx="0.5" fill="currentColor" opacity="0.4"/></svg>
      </div>
    </div>

    <!-- ===== APP HEADER ===== -->
    <header class="shrink-0 bg-marca-900 text-white flex items-center gap-3 px-5 py-3">
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
        <rect width="36" height="36" rx="10" fill="#22C55E"/>
        <path d="M10 18h4v10h-4zM18 10h4v18h-4zM22 18h4v10h-4z" fill="#fff" rx="2"/>
        <rect x="8" y="8" width="20" height="20" rx="4" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.35"/>
      </svg>
      <div>
        <div class="font-display font-bold text-lg leading-tight tracking-tight">LabMed</div>
        <div class="text-emerald-300 text-[10px] font-medium tracking-widest uppercase">Facilities &amp; Services</div>
      </div>
      <div class="ml-auto relative" data-nav="integracao-whatsapp" onclick="mostrarTela('integracao-whatsapp')" role="button" aria-label="Notificações">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="opacity-80"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full text-[9px] font-bold flex items-center justify-center text-white">3</span>
      </div>
    </header>

    <!-- ===== TELAS ===== -->
    <main>
      <!-- TELAS -->
    </main>

    <!-- ===== TOASTS ===== -->
    <div id="toast-container"></div>

    <!-- ===== MODAL ===== -->
    <div id="modal-fundo" onclick="if(event.target===this)fecharModal()">
      <div id="modal-caixa">
        <div class="flex items-center justify-between p-5 pb-3">
          <h3 id="modal-titulo" class="font-display font-bold text-lg text-marca-900"></h3>
          <button onclick="fecharModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-marca-50 text-marca-900 active:scale-90 transition-transform" aria-label="Fechar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div id="modal-corpo" class="px-5 pb-6"></div>
      </div>
    </div>

    <!-- ===== NAVEGAÇÃO INFERIOR ===== -->
    <nav class="shrink-0 bg-white border-t border-marca-100 flex items-start justify-around pt-1.5 pb-2 px-1 z-50" style="box-shadow: 0 -4px 20px rgba(20,83,29,0.08); padding-bottom: env(safe-area-inset-bottom, 6px);">

      <button data-nav="painel-principal" onclick="mostrarTela('painel-principal')" class="ativo relative flex flex-col items-center gap-0.5 py-1 px-1 text-[10px] font-medium text-marca-900/40 transition-colors w-14">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Painel
      </button>

      <button data-nav="agenda-multiprofissional" onclick="mostrarTela('agenda-multiprofissional')" class="relative flex flex-col items-center gap-0.5 py-1 px-1 text-[10px] font-medium text-marca-900/40 transition-colors w-14">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="8" cy="15" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="15" r="1.2" fill="currentColor" stroke="none"/><circle cx="16" cy="15" r="1.2" fill="currentColor" stroke="none"/></svg>
        Agenda
      </button>

      <button data-nav="prontuario-digital" onclick="mostrarTela('prontuario-digital')" class="relative flex flex-col items-center gap-0.5 py-1 px-1 text-[10px] font-medium text-marca-900/40 transition-colors w-14">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Prontuário
      </button>

      <button data-nav="centro-de-custos" onclick="mostrarTela('centro-de-custos')" class="relative flex flex-col items-center gap-0.5 py-1 px-1 text-[10px] font-medium text-marca-900/40 transition-colors w-14">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v12"/><path d="M8 10h8"/><path d="M8 14h8"/></svg>
        C. Custos
      </button>

      <button data-nav="cadastro-de-pacientes" onclick="mostrarTela('cadastro-de-pacientes')" class="relative flex flex-col items-center gap-0.5 py-1 px-1 text-[10px] font-medium text-marca-900/40 transition-colors w-14">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        Cadastro
      </button>

      <button data-nav="financeiro-e-repasses" onclick="mostrarTela('financeiro-e-repasses')" class="relative flex flex-col items-center gap-0.5 py-1 px-1 text-[10px] font-medium text-marca-900/40 transition-colors w-14">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Financeiro
      </button>

      <button data-nav="relatorios-gerenciais" onclick="mostrarTela('relatorios-gerenciais')" class="relative flex flex-col items-center gap-0.5 py-1 px-1 text-[10px] font-medium text-marca-900/40 transition-colors w-14">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
        Relatórios
      </button>

      <button data-nav="integracao-whatsapp" onclick="mostrarTela('integracao-whatsapp')" class="relative flex flex-col items-center gap-0.5 py-1 px-1 text-[10px] font-medium text-marca-900/40 transition-colors w-14">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        WhatsApp
      </button>

      <button data-nav="administracao-e-acessos" onclick="mostrarTela('administracao-e-acessos')" class="relative flex flex-col items-center gap-0.5 py-1 px-1 text-[10px] font-medium text-marca-900/40 transition-colors w-14">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Admin
      </button>

      <button data-nav="pagamentos-e-links" onclick="mostrarTela('pagamentos-e-links')" class="relative flex flex-col items-center gap-0.5 py-1 px-1 text-[10px] font-medium text-marca-900/40 transition-colors w-14">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="3"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        Pagar
      </button>

    </nav>
  </div>

  <script>
    // ===== ROTEADOR =====
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function(s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
      });
      document.querySelectorAll('[data-nav]').forEach(function(b) {
        b.classList.toggle('ativo', b.dataset.nav === id);
      });
      window.scrollTo({ top: 0 });
    }
    document.addEventListener('DOMContentLoaded', function() {
      mostrarTela('painel-principal');
    });

    // ===== STATUS BAR HORA =====
    (function atualizarHora() {
      var d = new Date();
      var h = String(d.getHours()).padStart(2,'0');
      var m = String(d.getMinutes()).padStart(2,'0');
      var el = document.getElementById('status-hora');
      if (el) el.textContent = h + ':' + m;
    })();

    // ===== TOASTS =====
    function toast(mensagem, tipo) {
      var c = document.getElementById('toast-container');
      var d = document.createElement('div');
      d.className = 'toast-item toast-' + (tipo || 'info');
      d.textContent = mensagem;
      c.appendChild(d);
      setTimeout(function() {
        d.classList.add('sair');
        setTimeout(function() { d.remove(); }, 320);
      }, 3000);
    }

    // ===== MODAL =====
    function abrirModal(html, titulo) {
      document.getElementById('modal-titulo').textContent = titulo || '';
      document.getElementById('modal-corpo').innerHTML = html;
      var f = document.getElementById('modal-fundo');
      f.classList.add('open');
      document.addEventListener('keydown', escFechar);
    }
    function fecharModal() {
      document.getElementById('modal-fundo').classList.remove('open');
      document.removeEventListener('keydown', escFechar);
    }
    function escFechar(e) { if (e.key === 'Escape') fecharModal(); }

    // ===== UTILITÁRIOS =====
    function brl(valor) {
      return 'R$ ' + Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function dataBR(iso) {
      if (!iso) return '—';
      var p = iso.split('-');
      return p[2] + '/' + p[1] + '/' + p[0];
    }

    // ===== SELEÇÃO DE PACIENTE =====
    var pacienteSelecionado = null;
    function selecionarPaciente(nome, id) {
      pacienteSelecionado = { nome: nome, id: id };
      toast('Paciente selecionado: ' + nome, 'ok');
      mostrarTela('painel-principal');
    }
  </script>

</body>
</html>
